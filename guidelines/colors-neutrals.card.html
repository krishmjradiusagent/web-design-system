<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="The near-monochrome base — neutral 50→950" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:16px;background:var(--background);font-family:var(--font-sans)}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)}
  .sw{flex:1;height:64px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
  .sw span{font-family:var(--font-mono);font-size:10px}
  .cap{display:flex;gap:0;margin-top:6px}
  .cap div{flex:1;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}
</style></head>
<body>
<div class="row" id="r"></div>
<div class="cap" id="c"></div>
<script>
const steps=[["50","#fafafa"],["100","#f5f5f5"],["200","#e5e5e5"],["300","#d4d4d4"],["400","#a3a3a3"],["500","#737373"],["600","#525252"],["700","#404040"],["800","#262626"],["900","#171717"],["950","#0a0a0a"]];
document.getElementById("r").innerHTML=steps.map(([k,v])=>`<div class="sw" style="background:${v};color:${parseInt(k)>=400?'#fff':'#171717'}"><span>${v.slice(1)}</span></div>`).join("");
document.getElementById("c").innerHTML=steps.map(([k])=>`<div>${k}</div>`).join("");
</script>
</body></html>
