<!-- @dsCard group="Brand" viewport="700x220" name="Mel — AI identity" subtitle="Glow-border motif; indigo→coral logo gradient" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}
  .row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .mel{width:56px;height:56px;flex-shrink:0}
  .grad{flex:1;min-width:160px;height:56px;border-radius:var(--radius-card);background:var(--mel-gradient)}
  .capsule{display:inline-flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:999px;background:var(--card);position:relative;box-shadow:var(--shadow-md)}
  .capsule::before{content:"";position:absolute;inset:-2px;border-radius:999px;background:var(--mel-gradient);z-index:-1}
  .capsule .inner{position:absolute;inset:1px;border-radius:999px;background:var(--card);z-index:-1}
  .capsule img{width:24px;height:24px}
  .capsule span{font-size:14px;font-weight:500}
  .dot{width:28px;height:28px;border-radius:999px;background:var(--mel-gradient);display:grid;place-items:center;color:#fff;font-size:13px}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);margin-top:14px}
</style></head>
<body>
  <div class="row">
    <img class="mel" src="../assets/mel-icon.svg" alt="Mel"/>
    <div class="capsule"><span class="inner"></span><img src="../assets/mel-icon.svg" alt=""/><span>Talk to Mel</span><span class="dot">↑</span></div>
    <div class="grad"></div>
  </div>
  <p class="lbl">Mel wears a consistent glow-border (Gemini/iOS-like). Mel wears <code>--mel-gradient</code> — the four stops taken straight from the Mel logo: #7B7FF5 → #5A5FF2 → #F08068 → #F0A468. Never recolor it.</p>
</body></html>
