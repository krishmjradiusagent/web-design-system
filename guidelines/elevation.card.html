<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Subtle shadows — never heavy chrome" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans)}
  .row{display:flex;gap:28px}
  .cell{display:flex;flex-direction:column;gap:12px;align-items:center}
  .box{width:110px;height:64px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card)}
  .t{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground)}
</style></head>
<body>
<div class="row">
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="t">shadow-xs</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="t">shadow-sm</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="t">shadow-md</div></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="t">shadow-lg</div></div>
</div>
</body></html>
