<!-- @dsCard group="Type" viewport="700x150" name="Numeric" subtitle="Money and metrics use Mona Sans tabular figures — no mono family" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th{text-align:left;color:var(--muted-foreground);font-weight:500;font-size:12px;padding:6px 12px}
  td{padding:6px 12px;border-top:1px solid var(--border)}
  .num{font-variant-numeric:tabular-nums;text-align:right}
</style></head>
<body>
<table>
  <thead><tr><th>Client</th><th style="text-align:right">Volume</th><th style="text-align:right">Commission</th><th style="text-align:right">Rate</th></tr></thead>
  <tbody>
    <tr><td>Nguyen residence</td><td class="num">$1,240,000</td><td class="num">$31,000</td><td class="num">2.50%</td></tr>
    <tr><td>Okafor purchase</td><td class="num">$865,000</td><td class="num">$21,625</td><td class="num">2.50%</td></tr>
    <tr><td>Delgado listing</td><td class="num">$2,100,000</td><td class="num">$52,500</td><td class="num">2.50%</td></tr>
  </tbody>
</table>
</body></html>
