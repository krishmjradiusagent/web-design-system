<!-- @dsCard group="Type" viewport="700x300" name="Font families" subtitle="Mona Sans (product UI, body) · Hubot Sans (headings, display, pull-out text)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans);display:flex;flex-direction:column;gap:20px}
  .name{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);text-transform:uppercase}
  .fam{display:flex;flex-direction:column;gap:6px}
  .spec-mona{font-family:var(--font-sans);font-size:24px;font-weight:400}
  .spec-hubot{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:var(--tracking-display)}
  .spec-num{font-family:var(--font-sans);font-size:22px;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="fam"><div class="name">Hubot Sans — headings, display, pull-out text (≥20px only)</div><div class="spec-hubot">Your next closing, handled</div></div>
  <div class="fam"><div class="name">Mona Sans — product UI, body, controls (400–700)</div><div class="spec-mona">Confirm the calculated commission</div></div>
  <div class="fam"><div class="name">Numbers — Mona Sans tabular figures, no mono family</div><div class="spec-num">$1,062,000 · 2.5% · $26,550</div></div>
</body></html>
