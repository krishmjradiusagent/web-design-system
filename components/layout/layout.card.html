<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--background)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);text-transform:uppercase;margin:0 0 8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Collapsible, AspectRatio, Toggle, ToggleGroup, Pagination, InputOTP, Toast, Icon } = window.RadiusUIDesignSystem_c7220b;
function Demo(){
  const [pg,setPg]=React.useState(3);
  return (
    <div className="grid">
      <div>
        <p className="lbl">Toggle group</p>
        <ToggleGroup type="single" defaultValue="list" items={[{value:"list",icon:<Icon name="list-checks"/>,ariaLabel:"List"},{value:"board",icon:<Icon name="layout-dashboard"/>,ariaLabel:"Board"},{value:"cal",icon:<Icon name="calendar"/>,ariaLabel:"Calendar"}]}/>
        <div style={{height:16}}/>
        <p className="lbl">Toggle</p>
        <div className="row"><Toggle variant="outline" defaultPressed><Icon name="star" size={16}/>Starred</Toggle><Toggle variant="outline">Only mine</Toggle></div>
        <div style={{height:16}}/>
        <p className="lbl">Collapsible</p>
        <Collapsible label="Advanced options" defaultOpen>
          <div style={{fontSize:13,color:"var(--muted-foreground)",lineHeight:1.6}}>Show archived deals, include co-listed transactions, and surface pre-market prospects.</div>
        </Collapsible>
      </div>
      <div>
        <p className="lbl">OTP</p>
        <InputOTP length={6} value="4821"/>
        <div style={{height:16}}/>
        <p className="lbl">Pagination</p>
        <Pagination page={pg} total={9} onChange={setPg}/>
        <div style={{height:16}}/>
        <p className="lbl">Toast</p>
        <Toast variant="success" icon={<Icon name="circle-check-big" size={18}/>} title="Commission confirmed" description="CDA generated and sent to your TC."/>
        <div style={{height:10}}/>
        <p className="lbl">Aspect ratio 16:9</p>
        <AspectRatio ratio={16/9}><div style={{background:"var(--muted)",display:"grid",placeItems:"center",color:"var(--muted-foreground)"}}><Icon name="map-pin" size={24}/></div></AspectRatio>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
