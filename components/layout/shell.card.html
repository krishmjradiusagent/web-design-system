<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}body{margin:0;background:var(--background)}#root{height:100%}a{color:var(--foreground)}a:hover{color:var(--muted-foreground)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { PageHeader, Sidebar, Button, Tabs, SearchInput, Icon, Avatar } = window.RadiusUIDesignSystem_c7220b;
const NAV = [
  { label: "Workspace", items: [
    { id: "dash", label: "Dashboard", icon: <Icon name="layout-dashboard" /> },
    { id: "deals", label: "Transactions", icon: <Icon name="folder" />, count: 24 },
    { id: "clients", label: "Clients", icon: <Icon name="users" />, count: 118 },
  ]},
];
const ROWS = [["1420 Ellis St","Closing Aug 22","$1.24M"],["88 Harbor Way","Inspection due","$860K"],["3 Mesa Ct","Docs pending","$1.05M"]];
function Demo(){
  const [nav,setNav]=React.useState("deals");
  const [dark,setDark]=React.useState(false);
  return (
    <div className="rds-appshell" data-theme={dark ? "dark" : undefined}>
      <Sidebar groups={NAV} active={nav} onSelect={setNav} />
      <div className="rds-appshell__main">
        <div className="rds-appshell__topbar">
          <div className="rds-appbar">
            <div className="rds-appbar__left"><SearchInput placeholder="Search…" style={{width:260}} /></div>
            <div className="rds-appbar__right"><Button variant="ghost" size="sm" onClick={()=>setDark(d=>!d)}><Icon name={dark?"sun":"moon"} size={16}/>{dark?"Light":"Dark"}</Button></div>
          </div>
        </div>
        <div className="rds-appshell__scroll">
          <div className="rds-appshell__well">
            <PageHeader title="Transactions" description="Every deal you're on, with the closing date and who's waiting on what."
              actions={<><Button variant="outline" size="sm"><Icon name="filter" size={16}/>Filters</Button><Button size="sm"><Icon name="plus" size={16}/>New deal</Button></>} />
            <div style={{border:"1px solid var(--border)",borderRadius:"var(--radius-lg)",background:"var(--card)",boxShadow:"var(--shadow-sm)",overflow:"hidden"}}>
              {ROWS.map(([a,st,p],i)=>(
                <div key={a} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,padding:"14px 20px",borderTop:i?"1px solid var(--border)":"none",fontSize:14}}>
                  <span style={{fontWeight:500}}>{a}</span>
                  <span style={{color:"var(--muted-foreground)",fontSize:13}}>{st}</span>
                  <span style={{fontFamily:"var(--font-mono)",fontSize:13}}>{p}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
