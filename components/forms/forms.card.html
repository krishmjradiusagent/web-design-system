<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;padding:20px;background:var(--background)}
  .grid{display:flex;flex-direction:column;gap:18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;gap:8px;min-width:200px}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted-foreground);text-transform:uppercase}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Input, Textarea, Select, Checkbox, RadioGroup, Switch, Slider, Field, Icon } = window.RadiusUIDesignSystem_c7220b;
function Demo(){
  return (
    <div className="grid">
      <div>
        <div className="lbl">Button — variants</div>
        <div className="row" style={{marginTop:8}}>
          <Button>Save changes</Button>
          <Button variant="secondary">Secondary</Button>
          <Button variant="outline" leftIcon={<Icon name="plus" />}>Add client</Button>
          <Button variant="ghost">Ghost</Button>
          <Button variant="destructive">Delete</Button>
          <Button variant="link">Link</Button>
        </div>
      </div>
      <div>
        <div className="lbl">Sizes &amp; states</div>
        <div className="row" style={{marginTop:8}}>
          <Button size="xs">xs</Button>
          <Button size="sm">sm</Button>
          <Button>default</Button>
          <Button size="lg">lg</Button>
          <Button size="icon" aria-label="More"><Icon name="more-horizontal" /></Button>
          <Button state="loading">Saving</Button>
          <Button state="disabled">Disabled</Button>
        </div>
      </div>
      <div className="row" style={{alignItems:"flex-start"}}>
        <div className="col">
          <div className="lbl">Input</div>
          <Field label="Client email" hint="We never share this.">
            <Input placeholder="jordan@acme.com" />
          </Field>
          <Field label="Deal stage"><Select options={[{value:"a",label:"Prospecting"},{value:"b",label:"Under contract"},{value:"c",label:"Closing"}]} /></Field>
        </div>
        <div className="col">
          <div className="lbl">Choice controls</div>
          <Checkbox label="Send closing reminders" defaultChecked />
          <RadioGroup name="side" defaultValue="buy" options={[{value:"buy",label:"Buyer side"},{value:"sell",label:"Seller side"},{value:"lease",label:"Lease"}]} />
          <Switch label="Auto-nurture new leads" defaultChecked />
        </div>
      </div>
      <div className="col">
        <div className="lbl">Slider</div>
        <Slider defaultValue={62} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
