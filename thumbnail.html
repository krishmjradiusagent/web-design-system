<!-- Homepage thumbnail — captured at ~72x48. App-icon scale, not a specimen sheet. -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="./styles.css"/>
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;display:flex;overflow:hidden}
  .main{flex:1;background:var(--neutral-950);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  .main img.mk{height:190px}
  .main img.wm{height:96px}
  .strip{width:300px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style></head>
<body>
<div class="tile">
  <div class="main">
    <img class="mk" src="./assets/logo-mark-light.svg" alt=""/>
    <img class="wm" src="./assets/logo-wordmark-white.svg" alt="Radius"/>
  </div>
  <div class="strip">
    <div style="background:#f0a468"></div>
    <div style="background:#f08068"></div>
    <div style="background:#7b7ff5"></div>
    <div style="background:#5a5ff2"></div>
  </div>
</div>
</body></html>
